<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mini Tower Defense</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #111;
    color: white;
}

#topbar {
    height: 64px;
    background: #202020;
    border-bottom: 2px solid #444;
    display: flex;
    align-items: center;
    gap: 22px;
    padding: 0 16px;
    font-size: 17px;
}

#title {
    font-weight: bold;
    font-size: 21px;
    margin-right: auto;
}

#game {
    position: relative;
    width: 100vw;
    height: calc(100vh - 64px);
    overflow: hidden;

    background:
        linear-gradient(#315f31 1px, transparent 1px),
        linear-gradient(90deg, #315f31 1px, transparent 1px),
        #397039;

    background-size: 40px 40px;
}

/* =========================
   길
========================= */

.path {
    position: absolute;
    background: #777;
    border: 4px solid #999;
    z-index: 1;
}

.path.horizontal {
    height: 80px;
}

.path.vertical {
    width: 80px;
}

/* =========================
   기지
========================= */

#base {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);

    width: 80px;
    height: 80px;

    background: #555;
    border: 5px solid #ddd;
    border-radius: 12px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 40px;
    z-index: 10;
}

/* =========================
   타워 설치 칸
========================= */

.buildSpot {
    position: absolute;

    width: 58px;
    height: 58px;

    background: rgba(0, 0, 0, .18);
    border: 2px dashed rgba(255,255,255,.45);
    border-radius: 10px;

    cursor: pointer;
    z-index: 3;
}

.buildSpot:hover {
    background: rgba(255,255,255,.18);
}

/* =========================
   타워
========================= */

.tower {
    position: absolute;

    width: 58px;
    height: 58px;

    border-radius: 50%;
    border: 4px solid #ddd;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 28px;

    z-index: 8;

    cursor: pointer;
}

.tower.archer {
    background: #2879c7;
}

.tower.cannon {
    background: #8c552e;
}

.tower.magic {
    background: #7439b7;
}

.range {
    position: absolute;

    width: 170px;
    height: 170px;

    border: 2px dashed rgba(255,255,255,.35);
    border-radius: 50%;

    transform: translate(-50%, -50%);

    pointer-events: none;

    z-index: 2;
}

/* =========================
   적
========================= */

.enemy {
    position: absolute;

    width: 42px;
    height: 42px;

    border-radius: 8px;

    display: flex;
    justify-content: center;
    align-items: center;

    font-size: 23px;

    z-index: 6;
}

.enemy.normal {
    background: #b72e2e;
    border: 3px solid #ff6666;
}

.enemy.fast {
    background: #bd741d;
    border: 3px solid #ffc05c;
}

.enemy.tank {
    background: #563c36;
    border: 4px solid #b99585;
    width: 52px;
    height: 52px;
}

.enemy.boss {
    background: #42144d;
    border: 5px solid #d36eea;
    width: 65px;
    height: 65px;
    font-size: 35px;
}

/* HP */

.hp {
    position: absolute;
    top: -10px;
    left: 0;

    width: 100%;
    height: 6px;

    background: #350000;
}

.hpFill {
    width: 100%;
    height: 100%;
    background: #31e031;
}

/* =========================
   탄환
========================= */

.projectile {
    position: absolute;

    width: 9px;
    height: 9px;

    background: yellow;
    border-radius: 50%;

    z-index: 20;
}

.projectile.cannon {
    width: 13px;
    height: 13px;
    background: #ff8a35;
}

.projectile.magic {
    width: 11px;
    height: 11px;
    background: #d875ff;
}

/* =========================
   하단 상점
========================= */

#shop {
    position: absolute;

    bottom: 12px;
    left: 50%;

    transform: translateX(-50%);

    background: rgba(20,20,20,.95);

    padding: 9px;

    border: 2px solid #555;
    border-radius: 12px;

    z-index: 50;

    display: flex;
    gap: 6px;
}

button {
    border: 0;
    border-radius: 7px;

    padding: 10px 14px;

    color: white;
    background: #287bc5;

    font-size: 14px;

    cursor: pointer;
}

button:hover {
    background: #3b93df;
}

button:disabled {
    background: #444;
    color: #999;
    cursor: not-allowed;
}

/* =========================
   선택창
========================= */

#upgradePanel {
    position: absolute;

    right: 15px;
    top: 15px;

    width: 220px;

    padding: 14px;

    background: rgba(20,20,20,.95);

    border: 2px solid #555;
    border-radius: 10px;

    display: none;

    z-index: 60;
}

#upgradePanel h3 {
    margin-top: 0;
}

/* =========================
   메시지
========================= */

#message {
    position: absolute;

    left: 50%;
    top: 45%;

    transform: translate(-50%, -50%);

    text-align: center;

    font-size: 42px;
    font-weight: bold;

    display: none;

    z-index: 100;
}

.small {
    font-size: 18px;
    margin-top: 10px;
}

/* 모바일 */
@media(max-width:700px) {

    #topbar {
        gap: 8px;
        font-size: 13px;
    }

    #title {
        font-size: 15px;
    }

    #shop {
        width: 96%;
        justify-content: center;
    }

    button {
        padding: 9px 7px;
        font-size: 12px;
    }
}
</style>
</head>

<body>

<div id="topbar">

    <div id="title">🏰 Mini Defense</div>

    <div>❤️ <span id="hpText">100</span></div>

    <div>💰 <span id="goldText">150</span></div>

    <div>🌊 <span id="waveText">1</span></div>

    <div>👾 <span id="enemyText">0</span></div>

</div>


<div id="game">

    <!-- 길 -->

    <div
        class="path horizontal"
        style="left:0;top:calc(50% - 40px);width:100%;">
    </div>


    <div
        class="path vertical"
        style="left:58%;top:20%;height:30%;">
    </div>


    <div
        class="path horizontal"
        style="left:30%;top:20%;width:30%;">
    </div>


    <!-- 기지 -->

    <div id="base">🏰</div>


    <!-- 설치 칸 -->

    <div class="buildSpot" style="left:15%;top:25%" data-x="15" data-y="25"></div>
    <div class="buildSpot" style="left:25%;top:65%" data-x="25" data-y="65"></div>

    <div class="buildSpot" style="left:38%;top:30%" data-x="38" data-y="30"></div>
    <div class="buildSpot" style="left:45%;top:65%" data-x="45" data-y="65"></div>

    <div class="buildSpot" style="left:55%;top:65%" data-x="55" data-y="65"></div>
    <div class="buildSpot" style="left:68%;top:30%" data-x="68" data-y="30"></div>

    <div class="buildSpot" style="left:78%;top:65%" data-x="78" data-y="65"></div>


    <!-- 업그레이드 -->

    <div id="upgradePanel">

        <h3>🔧 타워 업그레이드</h3>

        <div>
            레벨:
            <span id="towerLevel">1</span>
        </div>

        <div>
            공격력:
            <span id="towerDamage">20</span>
        </div>

        <div>
            사거리:
            <span id="towerRange">170</span>
        </div>

        <br>

        <button id="upgradeButton">
            ⬆️ 업그레이드 💰50
        </button>

        <button id="sellButton">
            💰 판매
        </button>

    </div>


    <!-- 상점 -->

    <div id="shop">

        <button id="archerButton">
            🏹 궁수 💰50
        </button>

        <button id="cannonButton">
            💣 대포 💰80
        </button>

        <button id="magicButton">
            🔮 마법 💰100
        </button>

        <button id="waveButton">
            ▶ 웨이브
        </button>

    </div>


    <div id="message"></div>

</div>


<script>

/* ==================================================
   기본 변수
================================================== */

const game = document.getElementById("game");

let gold = 150;
let baseHP = 100;
let wave = 1;

let enemies = [];
let towers = [];
let projectiles = [];

let selectedTower = null;

let spawning = false;
let gameOver = false;


/* ==================================================
   UI
================================================== */

function updateUI() {

    document.getElementById("hpText").textContent = baseHP;

    document.getElementById("goldText").textContent = gold;

    document.getElementById("waveText").textContent = wave;

    document.getElementById("enemyText").textContent =
        enemies.length;
}


/* ==================================================
   경로
================================================== */

/*
    오른쪽
      ↓
    상단길
      ↓
    중앙길 → 기지
*/

function getPathPosition(enemy) {

    const w = game.clientWidth;
    const h = game.clientHeight;

    const points = [

        [w - 30, h * .20],

        [w * .58, h * .20],

        [w * .58, h * .50],

        [90, h * .50]

    ];

    let segment = enemy.segment;

    if (segment >= points.length - 1) {
        return points[points.length - 1];
    }

    const a = points[segment];
    const b = points[segment + 1];

    const dx = b[0] - a[0];
    const dy = b[1] - a[1];

    const dist = Math.sqrt(dx*dx + dy*dy);

    enemy.distance += enemy.speed;

    let t = enemy.distance / dist;

    if (t >= 1) {

        enemy.segment++;

        enemy.distance = 0;

        return points[segment + 1];
    }

    return [

        a[0] + dx * t,

        a[1] + dy * t

    ];
}


/* ==================================================
   적 생성
================================================== */

function spawnEnemy(type = "normal") {

    let hp;
    let speed;
    let reward;
    let icon;

    if (type === "fast") {

        hp = 35 + wave * 8;
        speed = 2.5 + wave * .08;
        reward = 18;
        icon = "⚡";

    } else if (type === "tank") {

        hp = 160 + wave * 30;
        speed = .65 + wave * .03;
        reward = 35;
        icon = "🛡️";

    } else if (type === "boss") {

        hp = 1000 + wave * 250;
        speed = .45;
        reward = 200;
        icon = "👹";

    } else {

        hp = 60 + wave * 15;
        speed = 1.1 + wave * .04;
        reward = 12;
        icon = "👾";
    }


    const enemy = {

        type,

        hp,
        maxHP: hp,

        speed,

        reward,

        segment: 0,

        distance: 0,

        x: game.clientWidth - 30,

        y: game.clientHeight * .20,

        el: null

    };


    const el = document.createElement("div");

    el.className = "enemy " + type;

    el.textContent = icon;


    const hp = document.createElement("div");

    hp.className = "hp";


    const fill = document.createElement("div");

    fill.className = "hpFill";

    hp.appendChild(fill);

    el.appendChild(hp);


    game.appendChild(el);


    enemy.el = el;

    enemy.hpFill = fill;


    enemies.push(enemy);
}


/* ==================================================
   웨이브
================================================== */

async function startWave() {

    if (spawning || gameOver) return;

    spawning = true;


    let count = 5 + wave * 2;


    if (wave % 5 === 0) {

        spawnEnemy("boss");

    }


    for (let i = 0; i < count; i++) {

        if (gameOver) break;


        let type = "normal";


        if (wave >= 3 && Math.random() < .25) {

            type = "fast";

        }


        if (wave >= 4 && Math.random() < .15) {

            type = "tank";

        }


        spawnEnemy(type);


        await new Promise(
            r => setTimeout(r, 650)
        );
    }


    spawning = false;
}


/* ==================================================
   타워 생성
================================================== */

function buildTower(spot, type) {

    let cost;

    if (type === "archer") cost = 50;
    if (type === "cannon") cost = 80;
    if (type === "magic") cost = 100;


    if (gold < cost) return;


    gold -= cost;


    const rect = spot.getBoundingClientRect();

    const gameRect = game.getBoundingClientRect();


    const x =
        rect.left -
        gameRect.left;

    const y =
        rect.top -
        gameRect.top;


    const tower = {

        type,

        x,

        y,

        level: 1,

        damage:
            type === "archer" ? 20 :
            type === "cannon" ? 35 :
            50,

        range:
            type === "archer" ? 170 :
            type === "cannon" ? 150 :
            190,

        cooldown: 0,

        cost,

        el: null

    };


    const el = document.createElement("div");

    el.className = "tower " + type;


    el.textContent =
        type === "archer" ? "🏹" :
        type === "cannon" ? "💣" :
        "🔮";


    el.style.left = x + "px";
    el.style.top = y + "px";


    game.appendChild(el);


    tower.el = el;


    towers.push(tower);


    spot.style.display = "none";


    el.onclick = e => {

        e.stopPropagation();

        selectTower(tower);

    };


    updateUI();
}


/* ==================================================
   설치 칸 클릭
================================================== */

document.querySelectorAll(".buildSpot").forEach(spot => {

    spot.onclick = () => {

        if (gameOver) return;


        const type =
            prompt(
                "설치할 타워\n\n1 = 🏹 궁수 (50)\n2 = 💣 대포 (80)\n3 = 🔮 마법 (100)"
            );


        if (type === "1") {

            buildTower(spot, "archer");

        } else if (type === "2") {

            buildTower(spot, "cannon");

        } else if (type === "3") {

            buildTower(spot, "magic");
        }
    };

});


/* ==================================================
   타워 선택
================================================== */

function selectTower(tower) {

    selectedTower = tower;


    document.getElementById(
        "upgradePanel"
    ).style.display = "block";


    document.getElementById(
        "towerLevel"
    ).textContent = tower.level;


    document.getElementById(
        "towerDamage"
    ).textContent = tower.damage;


    document.getElementById(
        "towerRange"
    ).textContent = tower.range;
}


/* ==================================================
   업그레이드
================================================== */

document.getElementById(
    "upgradeButton"
).onclick = () => {

    if (!selectedTower) return;


    const cost =
        50 * selectedTower.level;


    if (gold < cost) return;


    gold -= cost;


    selectedTower.level++;

    selectedTower.damage =
        Math.round(
            selectedTower.damage * 1.45
        );

    selectedTower.range += 15;


    selectTower(selectedTower);

    updateUI();
};


/* ==================================================
   판매
================================================== */

document.getElementById(
    "sellButton"
).onclick = () => {

    if (!selectedTower) return;


    gold +=
        Math.floor(
            selectedTower.cost * .7
        );


    selectedTower.el.remove();


    towers =
        towers.filter(
            t => t !== selectedTower
        );


    document.getElementById(
        "upgradePanel"
    ).style.display = "none";


    selectedTower = null;


    updateUI();
};


/* ==================================================
   타워 공격 대상
================================================== */

function findTarget(tower) {

    let target = null;

    let best = Infinity;


    for (const enemy of enemies) {

        const dx =
            enemy.x -
            (tower.x + 29);

        const dy =
            enemy.y -
            (tower.y + 29);


        const d =
            Math.sqrt(
                dx*dx + dy*dy
            );


        if (
            d <= tower.range &&
            d < best
        ) {

            best = d;

            target = enemy;
        }
    }


    return target;
}


/* ==================================================
   발사
================================================== */

function fire(tower, enemy) {

    const p = {

        x: tower.x + 29,

        y: tower.y + 29,

        target: enemy,

        speed:
            tower.type === "magic"
            ? 9
            : tower.type === "cannon"
            ? 6
            : 10,

        damage: tower.damage,

        type: tower.type,

        el: null
    };


    const el =
        document.createElement("div");


    el.className =
        "projectile " + tower.type;


    game.appendChild(el);


    p.el = el;


    projectiles.push(p);
}


/* ==================================================
   타워 공격 주기
================================================== */

function towerAttack(tower) {

    if (tower.cooldown > 0) {

        tower.cooldown--;

        return;
    }


    const target =
        findTarget(tower);


    if (!target) return;


    fire(tower, target);


    tower.cooldown =
        tower.type === "archer"
        ? 22
        : tower.type === "cannon"
        ? 45
        : 30;
}


/* ==================================================
   투사체 업데이트
================================================== */

function updateProjectiles() {

    for (
        let i = projectiles.length - 1;
        i >= 0;
        i--
    ) {

        const p = projectiles[i];


        if (
            !p.target ||
            !enemies.includes(p.target)
        ) {

            p.el.remove();

            projectiles.splice(i, 1);

            continue;
        }


        const dx =
            p.target.x -
            p.x;

        const dy =
            p.target.y -
            p.y;


        const distance =
            Math.sqrt(
                dx*dx + dy*dy
            );


        if (distance < 12) {

            p.target.hp -= p.damage;


            /*
              대포는 범위 공격
            */

            if (p.type === "cannon") {

                for (const e of enemies) {

                    const ex =
                        e.x -
                        p.target.x;

                    const ey =
                        e.y -
                        p.target.y;


                    if (
                        Math.sqrt(
                            ex*ex + ey*ey
                        ) < 65
                    ) {

                        e.hp -=
                            p.damage * .45;
                    }
                }
            }


            p.el.remove();

            projectiles.splice(i, 1);

            continue;
        }


        p.x +=
            dx / distance *
            p.speed;


        p.y +=
            dy / distance *
            p.speed;


        p.el.style.left =
            p.x + "px";

        p.el.style.top =
            p.y + "px";
    }
}


/* ==================================================
   적 업데이트
================================================== */

function updateEnemies() {

    for (
        let i = enemies.length - 1;
        i >= 0;
        i--
    ) {

        const enemy = enemies[i];


        /*
          죽음
        */

        if (enemy.hp <= 0) {

            gold += enemy.reward;


            enemy.el.remove();


            enemies.splice(i, 1);


            continue;
        }


        const pos =
            getPathPosition(enemy);


        enemy.x = pos[0];

        enemy.y = pos[1];


        enemy.el.style.left =
            enemy.x - 21 + "px";

        enemy.el.style.top =
            enemy.y - 21 + "px";


        enemy.hpFill.style.width =
            Math.max(
                0,
                enemy.hp /
                enemy.maxHP *
                100
            ) + "%";


        /*
          기지 도착
        */

        if (
            enemy.segment >= 3
        ) {

            baseHP -=
                enemy.type === "boss"
                ? 40
                : 10;


            enemy.el.remove();


            enemies.splice(i, 1);


            if (baseHP <= 0) {

                baseHP = 0;

                endGame();
            }
        }
    }
}


/* ==================================================
   게임 오버
================================================== */

function endGame() {

    gameOver = true;


    const message =
        document.getElementById("message");


    message.innerHTML = `
        💀 GAME OVER
        <div class="small">
            Wave ${wave}
        </div>

        <button onclick="location.reload()">
            🔄 다시 시작
        </button>
    `;


    message.style.display =
        "block";
}


/* ==================================================
   웨이브 버튼
================================================== */

document.getElementById(
    "waveButton"
).onclick = () => {

    if (
        enemies.length === 0 &&
        !spawning
    ) {

        wave++;

        startWave();
    }
};


/* ==================================================
   메인 루프
================================================== */

function gameLoop() {

    if (!gameOver) {

        updateEnemies();


        for (const tower of towers) {

            towerAttack(tower);
        }


        updateProjectiles();


        updateUI();


        requestAnimationFrame(
            gameLoop
        );
    }
}


/* ==================================================
   시작
================================================== */

updateUI();

startWave();

gameLoop();

</script>

</body>
</html>

```html
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D 비행기 시뮬레이터</title>

<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: #75c9ff;
    font-family: Arial, sans-serif;
  }

  #info {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    color: white;
    background: rgba(0,0,0,.45);
    padding: 12px 16px;
    border-radius: 12px;
    line-height: 1.6;
    user-select: none;
  }

  #title {
    font-size: 20px;
    font-weight: bold;
  }

  #speed {
    color: #ffe600;
  }

  #altitude {
    color: #55ff88;
  }

  #crosshair {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 30px;
    z-index: 5;
    pointer-events: none;
  }

  #message {
    position: fixed;
    bottom: 20px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,.45);
    color: white;
    padding: 10px 18px;
    border-radius: 20px;
    z-index: 10;
  }
</style>
</head>

<body>

<div id="info">
  <div id="title">✈️ 3D 비행기 시뮬레이터</div>
  속도: <span id="speed">120</span> km/h<br>
  고도: <span id="altitude">1000</span> m<br>
  방향: <span id="heading">0</span>°
</div>

<div id="crosshair">+</div>

<div id="message">
  W/S 상승·하강 | A/D 방향 | ↑↓ 기수 | ←→ 롤 | SPACE 가속
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
/* =========================
   기본 설정
========================= */

const scene = new THREE.Scene();

scene.background = new THREE.Color(0x75c9ff);
scene.fog = new THREE.Fog(0x75c9ff, 100, 2500);

const camera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.1,
  5000
);

const renderer = new THREE.WebGLRenderer({
  antialias: true
});

renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);


/* =========================
   조명
========================= */

const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(500, 1000, 500);
scene.add(sun);

const ambient = new THREE.HemisphereLight(
  0xffffff,
  0x668866,
  1.5
);

scene.add(ambient);


/* =========================
   바다 / 지면
========================= */

const groundGeometry = new THREE.PlaneGeometry(10000, 10000);
const groundMaterial = new THREE.MeshStandardMaterial({
  color: 0x1674a8,
  roughness: 1
});

const ground = new THREE.Mesh(
  groundGeometry,
  groundMaterial
);

ground.rotation.x = -Math.PI / 2;
ground.position.y = -120;

scene.add(ground);


/* =========================
   비행기 만들기
========================= */

const airplane = new THREE.Group();

const bodyMaterial = new THREE.MeshStandardMaterial({
  color: 0xffffff,
  metalness: 0.2,
  roughness: 0.4
});

const redMaterial = new THREE.MeshStandardMaterial({
  color: 0xe53935
});


// 동체
const body = new THREE.Mesh(
  new THREE.CylinderGeometry(2.2, 1.5, 18, 16),
  bodyMaterial
);

body.rotation.z = Math.PI / 2;
airplane.add(body);


// 앞부분
const nose = new THREE.Mesh(
  new THREE.ConeGeometry(2.2, 5, 16),
  bodyMaterial
);

nose.rotation.z = -Math.PI / 2;
nose.position.x = 11;

airplane.add(nose);


// 날개
const wing = new THREE.Mesh(
  new THREE.BoxGeometry(8, 0.5, 34),
  bodyMaterial
);

wing.position.x = 1;
airplane.add(wing);


// 꼬리날개
const tailWing = new THREE.Mesh(
  new THREE.BoxGeometry(3, 0.4, 12),
  bodyMaterial
);

tailWing.position.x = -7;
airplane.add(tailWing);


// 수직 꼬리날개
const verticalTail = new THREE.Mesh(
  new THREE.BoxGeometry(3, 5, 0.5),
  redMaterial
);

verticalTail.position.set(-7, 2.5, 0);
airplane.add(verticalTail);


// 엔진
for (let z of [-5, 5]) {

  const engine = new THREE.Mesh(
    new THREE.CylinderGeometry(1.3, 1.3, 5, 16),
    new THREE.MeshStandardMaterial({
      color: 0x444444,
      metalness: 0.8
    })
  );

  engine.rotation.z = Math.PI / 2;
  engine.position.set(2, -1.5, z);

  airplane.add(engine);
}


// 비행기를 약간 아래쪽에 배치
airplane.position.set(0, 100, 0);

scene.add(airplane);


/* =========================
   구름
========================= */

function createCloud(x, y, z) {

  const cloud = new THREE.Group();

  const material = new THREE.MeshStandardMaterial({
    color: 0xffffff
  });

  for (let i = 0; i < 6; i++) {

    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(
        8 + Math.random() * 7,
        16,
        16
      ),
      material
    );

    sphere.position.set(
      i * 10 - 25,
      Math.random() * 8,
      Math.random() * 12
    );

    cloud.add(sphere);
  }

  cloud.position.set(x, y, z);

  scene.add(cloud);
}


// 여러 구름
for (let i = 0; i < 35; i++) {

  createCloud(
    (Math.random() - 0.5) * 3000,
    200 + Math.random() * 500,
    (Math.random() - 0.5) * 3000
  );

}


/* =========================
   조작
========================= */

const keys = {};

window.addEventListener("keydown", e => {
  keys[e.code] = true;
});

window.addEventListener("keyup", e => {
  keys[e.code] = false;
});


/* =========================
   비행 변수
========================= */

let speed = 120;
let altitude = 1000;
let heading = 0;

let pitch = 0;
let roll = 0;

const speedText = document.getElementById("speed");
const altitudeText = document.getElementById("altitude");
const headingText = document.getElementById("heading");


/* =========================
   게임 루프
========================= */

const clock = new THREE.Clock();

function animate() {

  requestAnimationFrame(animate);

  const delta = Math.min(clock.getDelta(), 0.05);


  /* 속도 */

  if (keys["Space"]) {
    speed += 80 * delta;
  } else {
    speed -= 15 * delta;
  }

  speed = THREE.MathUtils.clamp(speed, 60, 500);


  /* 상승 / 하강 */

  if (keys["KeyW"]) {
    pitch -= 0.6 * delta;
  }

  if (keys["KeyS"]) {
    pitch += 0.6 * delta;
  }


  /* 좌우 방향 */

  if (keys["KeyA"]) {
    heading += 0.8 * delta;
  }

  if (keys["KeyD"]) {
    heading -= 0.8 * delta;
  }


  /* 롤 */

  if (keys["ArrowLeft"]) {
    roll += 1.2 * delta;
  }

  if (keys["ArrowRight"]) {
    roll -= 1.2 * delta;
  }


  /* 기수 */

  if (keys["ArrowUp"]) {
    pitch -= 0.8 * delta;
  }

  if (keys["ArrowDown"]) {
    pitch += 0.8 * delta;
  }


  /* 자동 복원 */

  if (
    !keys["ArrowLeft"] &&
    !keys["ArrowRight"]
  ) {
    roll *= 0.97;
  }

  if (
    !keys["ArrowUp"] &&
    !keys["ArrowDown"] &&
    !keys["KeyW"] &&
    !keys["KeyS"]
  ) {
    pitch *= 0.99;
  }


  /* 비행기 회전 */

  airplane.rotation.x = pitch;
  airplane.rotation.y = heading;
  airplane.rotation.z = roll;


  /* 이동 */

  const direction = new THREE.Vector3(1, 0, 0);

  direction.applyQuaternion(
    airplane.quaternion
  );

  const movement =
    direction.multiplyScalar(speed * delta * 0.8);

  airplane.position.add(movement);


  /* 고도 */
  altitude = Math.max(
    100,
    airplane.position.y * 10
  );


  /* 카메라 */

  const cameraOffset = new THREE.Vector3(
    -35,
    12,
    0
  );

  cameraOffset.applyQuaternion(
    airplane.quaternion
  );

  camera.position.copy(
    airplane.position
  ).add(cameraOffset);

  const lookAt = new THREE.Vector3(
    30,
    0,
    0
  );

  lookAt.applyQuaternion(
    airplane.quaternion
  );

  lookAt.add(airplane.position);

  camera.lookAt(lookAt);


  /* 화면 정보 */

  speedText.textContent =
    Math.round(speed);

  altitudeText.textContent =
    Math.round(altitude);

  let h =
    THREE.MathUtils.radToDeg(heading) % 360;

  if (h < 0) h += 360;

  headingText.textContent =
    Math.round(h);


  renderer.render(scene, camera);
}

animate();


/* =========================
   화면 크기 변경
========================= */

window.addEventListener("resize", () => {

  camera.aspect =
    window.innerWidth /
    window.innerHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

});
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>HTML Minecraft v3</title>

<style>
*{box-sizing:border-box}
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#87ceeb;
    font-family:Arial,sans-serif;
}
canvas{display:block}

#crosshair{
    position:fixed;
    left:50%;
    top:50%;
    width:18px;
    height:18px;
    transform:translate(-50%,-50%);
    pointer-events:none;
    z-index:10;
}
#crosshair:before,#crosshair:after{
    content:"";
    position:absolute;
    background:white;
    box-shadow:0 0 3px #000;
}
#crosshair:before{
    width:2px;
    height:18px;
    left:8px;
}
#crosshair:after{
    width:18px;
    height:2px;
    top:8px;
}

#hud{
    position:fixed;
    top:12px;
    left:12px;
    z-index:20;
    color:white;
    text-shadow:2px 2px 3px #000;
    pointer-events:none;
}
#title{
    font-size:22px;
    font-weight:bold;
}
#info{
    margin-top:4px;
    font-size:13px;
    line-height:1.5;
}
#coords{
    font-family:monospace;
    font-size:12px;
}

#hotbar{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%);
    display:flex;
    gap:4px;
    z-index:20;
}
.slot{
    width:54px;
    height:54px;
    background:rgba(20,20,20,.8);
    border:3px solid #555;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}
.slot.selected{
    border-color:white;
    transform:scale(1.08);
}
.slot-number{
    position:absolute;
    top:2px;
    left:4px;
    color:white;
    font-size:11px;
    text-shadow:1px 1px 2px #000;
}
.block-icon{
    width:32px;
    height:32px;
    image-rendering:pixelated;
}

#message{
    position:fixed;
    left:50%;
    top:64%;
    transform:translate(-50%,-50%);
    color:white;
    font-weight:bold;
    font-size:20px;
    text-shadow:2px 2px 3px #000;
    pointer-events:none;
    opacity:0;
    z-index:30;
}

#breakBar{
    position:fixed;
    left:50%;
    top:calc(50% + 25px);
    transform:translateX(-50%);
    width:160px;
    height:12px;
    border:2px solid white;
    background:rgba(0,0,0,.6);
    display:none;
    z-index:30;
}
#breakProgress{
    width:0%;
    height:100%;
    background:white;
}

#start{
    position:fixed;
    inset:0;
    z-index:100;
    display:flex;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.5);
}
#box{
    width:min(90%,500px);
    padding:30px;
    text-align:center;
    color:white;
    background:rgba(20,20,20,.94);
    border:2px solid #777;
}
#box h1{
    margin-top:0;
    font-size:35px;
}
button{
    padding:13px 30px;
    border:0;
    color:white;
    background:#4caf50;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}
</style>
</head>

<body>

<div id="hud">
    <div id="title">HTML Minecraft v3</div>
    <div id="info">
        WASD 이동 · Shift 달리기 · Space 점프<br>
        좌클릭 채굴 · 우클릭 설치 · 1~5 선택 · ESC
    </div>
    <div id="coords">XYZ: 0 / 0 / 0</div>
</div>

<div id="crosshair"></div>

<div id="breakBar">
    <div id="breakProgress"></div>
</div>

<div id="message"></div>

<div id="hotbar"></div>

<div id="start">
    <div id="box">
        <h1>⛏️ HTML Minecraft v3</h1>
        <p>
            청크 + InstancedMesh 기반<br>
            성능 개선 버전
        </p>
        <p>
            WASD로 움직이고 마우스로 둘러보세요.
        </p>
        <button id="startButton">게임 시작</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>
"use strict";

/* =========================================================
   THREE
========================================================= */

const scene=new THREE.Scene();

const camera=new THREE.PerspectiveCamera(
    75,
    innerWidth/innerHeight,
    .05,
    180
);

const renderer=new THREE.WebGLRenderer({
    antialias:false
});

renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(
    Math.min(devicePixelRatio,1.5)
);

/* 그림자 OFF */
renderer.shadowMap.enabled=false;

document.body.appendChild(renderer.domElement);

scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(
    0x87ceeb,
    35,
    120
);


/* =========================================================
   LIGHT
========================================================= */

const ambient=new THREE.AmbientLight(
    0xffffff,
    .8
);

scene.add(ambient);

const sun=new THREE.DirectionalLight(
    0xffffff,
    1
);

sun.position.set(
    50,
    100,
    30
);

scene.add(sun);


/* =========================================================
   BLOCKS
========================================================= */

const BLOCKS={
    grass:{
        name:"잔디",
        color:0x55aa35,
        hardness:.35
    },

    dirt:{
        name:"흙",
        color:0x8b5a2b,
        hardness:.3
    },

    stone:{
        name:"돌",
        color:0x888888,
        hardness:1
    },

    wood:{
        name:"나무",
        color:0x98602d,
        hardness:.7
    },

    leaves:{
        name:"나뭇잎",
        color:0x329238,
        hardness:.15
    },

    sand:{
        name:"모래",
        color:0xd8c27a,
        hardness:.25
    },

    water:{
        name:"물",
        color:0x3b9ed0,
        hardness:999,
        liquid:true
    }
};

const hotbarTypes=[
    "grass",
    "dirt",
    "stone",
    "wood",
    "leaves"
];


/* =========================================================
   MATERIALS
========================================================= */

const materials={};

for(const type in BLOCKS){

    materials[type]=
        new THREE.MeshLambertMaterial({
            color:BLOCKS[type].color,
            transparent:
                type==="water",
            opacity:
                type==="water" ? .65 : 1
        });
}


/* =========================================================
   GEOMETRY
========================================================= */

const cubeGeometry=
    new THREE.BoxGeometry(1,1,1);


/* =========================================================
   WORLD
========================================================= */

const world=new Map();

function key(x,y,z){
    return `${x},${y},${z}`;
}

function getBlock(x,y,z){
    return world.get(key(x,y,z));
}

function setBlock(x,y,z,type){
    world.set(
        key(x,y,z),
        type
    );
}

function removeBlock(x,y,z){
    world.delete(
        key(x,y,z)
    );
}


/* =========================================================
   CHUNK
========================================================= */

const CHUNK_SIZE=16;

const RENDER_DISTANCE=3;

const chunks=new Map();

function chunkKey(cx,cz){
    return `${cx},${cz}`;
}

function worldToChunk(v){

    return Math.floor(
        v/CHUNK_SIZE
    );
}


/* =========================================================
   TERRAIN
========================================================= */

function terrainHeight(x,z){

    return Math.max(
        1,
        Math.floor(
            5+
            Math.sin(x*.15)*2+
            Math.cos(z*.13)*2+
            Math.sin((x+z)*.08)*1.5+
            Math.cos((x-z)*.05)*1.2
        )
    );
}


/* =========================================================
   TREE
========================================================= */

function generateTree(x,z){

    const ground=
        terrainHeight(x,z);

    if(ground<4)return;

    for(
        let y=ground+1;
        y<=ground+4;
        y++
    ){
        setBlock(
            x,y,z,
            "wood"
        );
    }

    for(
        let dx=-2;
        dx<=2;
        dx++
    ){

        for(
            let dz=-2;
            dz<=2;
            dz++
        ){

            for(
                let dy=3;
                dy<=5;
                dy++
            ){

                if(
                    Math.abs(dx)+
                    Math.abs(dz)<=2
                ){

                    if(
                        !(dx===0 &&
                          dz===0 &&
                          dy<5)
                    ){

                        if(
                            getBlock(
                                x+dx,
                                ground+dy,
                                z+dz
                            )===undefined
                        ){

                            setBlock(
                                x+dx,
                                ground+dy,
                                z+dz,
                                "leaves"
                            );
                        }
                    }
                }
            }
        }
    }
}


/* =========================================================
   GENERATE CHUNK
========================================================= */

function generateChunkData(cx,cz){

    const minX=
        cx*CHUNK_SIZE;

    const minZ=
        cz*CHUNK_SIZE;

    const maxX=
        minX+CHUNK_SIZE-1;

    const maxZ=
        minZ+CHUNK_SIZE-1;

    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let z=minZ;
            z<=maxZ;
            z++
        ){

            const height=
                terrainHeight(x,z);

            for(
                let y=0;
                y<=height;
                y++
            ){

                let type;

                if(
                    y===height
                ){
                    type="grass";
                }
                else if(
                    y>=height-2
                ){
                    type="dirt";
                }
                else{
                    type="stone";
                }

                setBlock(
                    x,y,z,type
                );
            }

            /*
             * 바닷물
             */

            const WATER=4;

            if(
                height<WATER
            ){

                for(
                    let y=height+1;
                    y<=WATER;
                    y++
                ){

                    setBlock(
                        x,y,z,
                        "water"
                    );
                }
            }
        }
    }


    /*
     * 나무 확률
     */

    let seed=
        Math.abs(
            cx*928371+
            cz*192837
        );

    for(
        let i=0;
        i<5;
        i++
    ){

        seed=
            (
                seed*1664525+
                1013904223
            )>>>0;

        const x=
            minX+
            seed%CHUNK_SIZE;

        seed=
            (
                seed*1664525+
                1013904223
            )>>>0;

        const z=
            minZ+
            seed%CHUNK_SIZE;

        seed=
            (
                seed*1664525+
                1013904223
            )>>>0;

        if(
            seed%100<35
        ){

            generateTree(
                x,z
            );
        }
    }
}


/* =========================================================
   VISIBLE BLOCK
========================================================= */

function isTransparent(type){

    return (
        type===undefined ||
        type==="water" ||
        type==="leaves"
    );
}

function shouldRenderBlock(
    x,y,z
){

    const type=
        getBlock(x,y,z);

    if(type===undefined){
        return false;
    }

    const neighbors=[
        getBlock(x+1,y,z),
        getBlock(x-1,y,z),
        getBlock(x,y+1,z),
        getBlock(x,y-1,z),
        getBlock(x,y,z+1),
        getBlock(x,y,z-1)
    ];

    for(
        const n of neighbors
    ){

        if(
            isTransparent(n)
        ){

            return true;
        }
    }

    return false;
}


/* =========================================================
   CHUNK RENDER
========================================================= */

function buildChunk(
    cx,
    cz
){

    const ck=
        chunkKey(cx,cz);

    if(
        chunks.has(ck)
    ){

        const old=
            chunks.get(ck);

        scene.remove(old.group);

        chunks.delete(ck);
    }

    const group=
        new THREE.Group();

    const blocksByType={};

    for(
        const type in BLOCKS
    ){

        blocksByType[type]=[];
    }


    const minX=
        cx*CHUNK_SIZE;

    const minZ=
        cz*CHUNK_SIZE;

    const maxX=
        minX+CHUNK_SIZE-1;

    const maxZ=
        minZ+CHUNK_SIZE-1;


    /*
     * visible blocks만 수집
     */

    for(
        let x=minX;
        x<=maxX;
        x++
    ){

        for(
            let z=minZ;
            z<=maxZ;
            z++
        ){

            /*
             * 높이 제한
             */

            for(
                let y=0;
                y<=24;
                y++
            ){

                const type=
                    getBlock(x,y,z);

                if(
                    type===undefined
                ){
                    continue;
                }

                if(
                    shouldRenderBlock(
                        x,y,z
                    )
                ){

                    blocksByType[
                        type
                    ].push({
                        x,y,z
                    });
                }
            }
        }
    }


    /*
     * InstancedMesh
     */

    const matrix=
        new THREE.Matrix4();

    for(
        const type in blocksByType
    ){

        const list=
            blocksByType[type];

        if(
            list.length===0
        ){
            continue;
        }

        const mesh=
            new THREE.InstancedMesh(
                cubeGeometry,
                materials[type],
                list.length
            );

        mesh.instanceMatrix
            .setUsage(
                THREE.DynamicDrawUsage
            );

        for(
            let i=0;
            i<list.length;
            i++
        ){

            const b=
                list[i];

            matrix.makeTranslation(
                b.x+.5,
                b.y+.5,
                b.z+.5
            );

            mesh.setMatrixAt(
                i,
                matrix
            );
        }

        mesh.instanceMatrix
            .needsUpdate=true;

        /*
         * InstancedMesh 자체의 userData에
         * 블록 종류를 저장
         */

        mesh.userData.blockType=
            type;

        group.add(
            mesh
        );
    }

    scene.add(
        group
    );

    chunks.set(
        ck,
        {
            group:group
        }
    );
}


/* =========================================================
   CHUNK LOAD
========================================================= */

function ensureChunk(
    cx,
    cz
){

    if(
        !chunks.has(
            chunkKey(cx,cz)
        )
    ){

        generateChunkData(
            cx,cz
        );

        buildChunk(
            cx,cz
        );
    }
}


/* =========================================================
   INITIAL WORLD
========================================================= */

for(
    let cx=-RENDER_DISTANCE;
    cx<=RENDER_DISTANCE;
    cx++
){

    for(
        let cz=-RENDER_DISTANCE;
        cz<=RENDER_DISTANCE;
        cz++
    ){

        ensureChunk(
            cx,cz
        );
    }
}


/* =========================================================
   PLAYER
========================================================= */

const player={

    position:
        new THREE.Vector3(
            0,
            15,
            8
        ),

    velocity:
        new THREE.Vector3(),

    width:.6,

    height:1.8,

    speed:5,

    sprint:8,

    jump:8,

    onGround:false
};

camera.position.copy(
    player.position
);

camera.position.y+=1.6;


/* =========================================================
   COLLISION
========================================================= */

function solid(
    x,y,z
){

    const type=
        getBlock(
            Math.floor(x),
            Math.floor(y),
            Math.floor(z)
        );

    return (
        type!==undefined &&
        type!=="water" &&
        type!=="leaves"
    );
}

function collides(pos){

    const minX=
        pos.x-player.width/2;

    const maxX=
        pos.x+player.width/2;

    const minY=
        pos.y;

    const maxY=
        pos.y+player.height;

    const minZ=
        pos.z-player.width/2;

    const maxZ=
        pos.z+player.width/2;

    for(
        let x=Math.floor(minX);
        x<=Math.floor(maxX);
        x++
    ){

        for(
            let y=Math.floor(minY);
            y<=Math.floor(maxY);
            y++
        ){

            for(
                let z=Math.floor(minZ);
                z<=Math.floor(maxZ);
                z++
            ){

                if(
                    solid(x,y,z)
                ){
                    return true;
                }
            }
        }
    }

    return false;
}


function move(
    dx,dy,dz
){

    let next=
        player.position.clone();

    next.x+=dx;

    if(
        !collides(next)
    ){
        player.position.x=
            next.x;
    }


    next=
        player.position.clone();

    next.y+=dy;

    if(
        !collides(next)
    ){

        player.position.y=
            next.y;

        player.onGround=false;

    }else{

        if(dy<0){
            player.onGround=true;
        }

        player.velocity.y=0;
    }


    next=
        player.position.clone();

    next.z+=dz;

    if(
        !collides(next)
    ){
        player.position.z=
            next.z;
    }
}


/* =========================================================
   INPUT
========================================================= */

const keys={};

let selectedBlock=0;

addEventListener(
    "keydown",
    e=>{

        keys[e.code]=true;

        if(
            e.code==="Space"
        ){

            e.preventDefault();

            if(
                player.onGround
            ){

                player.velocity.y=
                    player.jump;

                player.onGround=false;
            }
        }

        if(
            e.code.startsWith(
                "Digit"
            )
        ){

            const n=
                Number(
                    e.code.substring(5)
                );

            if(
                n>=1 &&
                n<=5
            ){

                selectedBlock=
                    n-1;

                updateHotbar();
            }
        }
    }
);

addEventListener(
    "keyup",
    e=>{
        keys[e.code]=false;
    }
);


/* =========================================================
   MOUSE
========================================================= */

let yaw=0;
let pitch=0;

document.addEventListener(
    "mousemove",
    e=>{

        if(
            document.pointerLockElement
            !==renderer.domElement
        ){
            return;
        }

        yaw-=
            e.movementX*.0025;

        pitch-=
            e.movementY*.0025;

        const limit=
            Math.PI/2-.01;

        pitch=
            Math.max(
                -limit,
                Math.min(
                    limit,
                    pitch
                )
            );
    }
);


/* =========================================================
   RAYCAST
========================================================= */

const raycaster=
    new THREE.Raycaster();

raycaster.far=7;

const center=
    new THREE.Vector2(0,0);


/*
 * InstancedMesh를 이용하기 때문에
 * intersection.instanceId를 사용한다.
 *
 * 위치는 matrix에서 복원한다.
 */

function getTarget(){

    raycaster.setFromCamera(
        center,
        camera
    );

    const objects=[];

    for(
        const chunk of chunks.values()
    ){

        for(
            const obj of
            chunk.group.children
        ){

            objects.push(obj);
        }
    }

    const hits=
        raycaster.intersectObjects(
            objects,
            false
        );

    if(
        hits.length===0
    ){
        return null;
    }

    const hit=hits[0];

    const mesh=hit.object;

    if(
        hit.instanceId===undefined
    ){
        return null;
    }

    const matrix=
        new THREE.Matrix4();

    mesh.getMatrixAt(
        hit.instanceId,
        matrix
    );

    const pos=
        new THREE.Vector3();

    pos.setFromMatrixPosition(
        matrix
    );

    return {
        mesh:mesh,
        instanceId:hit.instanceId,
        type:mesh.userData.blockType,
        x:Math.floor(pos.x),
        y:Math.floor(pos.y),
        z:Math.floor(pos.z),
        face:hit.face
    };
}


/* =========================================================
   CHUNK UPDATE
========================================================= */

function rebuildAround(
    x,z
){

    const cx=
        worldToChunk(x);

    const cz=
        worldToChunk(z);

    for(
        let dx=-1;
        dx<=1;
        dx++
    ){

        for(
            let dz=-1;
            dz<=1;
            dz++
        ){

            const ncx=
                cx+dx;

            const ncz=
                cz+dz;

            if(
                chunks.has(
                    chunkKey(
                        ncx,
                        ncz
                    )
                )
            ){

                buildChunk(
                    ncx,
                    ncz
                );
            }
        }
    }
}


/* =========================================================
   BREAK
========================================================= */

let breaking=false;
let breakTarget=null;
let breakStart=0;
let breakDuration=0;

const breakBar=
    document.getElementById(
        "breakBar"
    );

const breakProgress=
    document.getElementById(
        "breakProgress"
    );


function startBreak(
    target
){

    if(
        !target
    ){
        return;
    }

    if(
        target.type==="water"
    ){
        return;
    }

    if(
        target.y<=0
    ){
        return;
    }

    const k=
        key(
            target.x,
            target.y,
            target.z
        );

    if(
        breaking &&
        breakTarget===k
    ){
        return;
    }

    breaking=true;

    breakTarget=k;

    breakStart=
        performance.now();

    breakDuration=
        BLOCKS[
            target.type
        ].hardness*500;

    breakBar.style.display=
        "block";
}


function cancelBreak(){

    breaking=false;

    breakTarget=null;

    breakBar.style.display=
        "none";

    breakProgress.style.width=
        "0%";
}


function updateBreak(){

    if(
        !breaking
    ){
        return;
    }

    const parts=
        breakTarget
            .split(",")
            .map(Number);

    const type=
        getBlock(
            parts[0],
            parts[1],
            parts[2]
        );

    if(
        type===undefined
    ){

        cancelBreak();

        return;
    }

    const progress=
        Math.min(
            1,
            (
                performance.now()-
                breakStart
            )/
            breakDuration
        );

    breakProgress.style.width=
        (progress*100)+"%";


    if(
        progress>=1
    ){

        removeBlock(
            parts[0],
            parts[1],
            parts[2]
        );

        rebuildAround(
            parts[0],
            parts[2]
        );

        showMessage(
            "⛏️ "+
            BLOCKS[type].name+
            " 채굴"
        );

        cancelBreak();
    }
}


/* =========================================================
   PLACE
========================================================= */

function placeBlock(){

    const target=
        getTarget();

    if(
        !target
    ){
        return;
    }

    const normal=
        target.face.normal;

    const x=
        target.x+
        Math.round(normal.x);

    const y=
        target.y+
        Math.round(normal.y);

    const z=
        target.z+
        Math.round(normal.z);


    if(
        getBlock(
            x,y,z
        )!==undefined
    ){
        return;
    }


    /*
     * 플레이어 충돌 검사
     */

    const boxMin=
        new THREE.Vector3(
            x,y,z
        );

    const boxMax=
        new THREE.Vector3(
            x+1,
            y+1,
            z+1
        );

    const playerMin=
        new THREE.Vector3(
            player.position.x-
                player.width/2,
            player.position.y,
            player.position.z-
                player.width/2
        );

    const playerMax=
        new THREE.Vector3(
            player.position.x+
                player.width/2,
            player.position.y+
                player.height,
            player.position.z+
                player.width/2
        );

    if(
        boxMin.x<playerMax.x &&
        boxMax.x>playerMin.x &&
        boxMin.y<playerMax.y &&
        boxMax.y>playerMin.y &&
        boxMin.z<playerMax.z &&
        boxMax.z>playerMin.z
    ){
        return;
    }


    const type=
        hotbarTypes[
            selectedBlock
        ];

    setBlock(
        x,y,z,type
    );

    rebuildAround(
        x,z
    );

    showMessage(
        "🧱 "+
        BLOCKS[type].name+
        " 설치"
    );
}


/* =========================================================
   MOUSE BUTTON
========================================================= */

let mouseDown=false;

addEventListener(
    "mousedown",
    e=>{

        if(
            document.pointerLockElement
            !==renderer.domElement
        ){
            return;
        }

        if(
            e.button===0
        ){

            mouseDown=true;

            const target=
                getTarget();

            startBreak(
                target
            );
        }

        if(
            e.button===2
        ){

            placeBlock();
        }
    }
);

addEventListener(
    "mouseup",
    e=>{

        if(
            e.button===0
        ){

            mouseDown=false;

            cancelBreak();
        }
    }
);

addEventListener(
    "contextmenu",
    e=>{
        e.preventDefault();
    }
);


/* =========================================================
   HOTBAR
========================================================= */

const hotbar=
    document.getElementById(
        "hotbar"
    );

function updateHotbar(){

    hotbar.innerHTML="";

    hotbarTypes.forEach(
        (type,index)=>{

            const slot=
                document.createElement(
                    "div"
                );

            slot.className="slot";

            if(
                index===selectedBlock
            ){
                slot.classList.add(
                    "selected"
                );
            }

            const num=
                document.createElement(
                    "div"
                );

            num.className=
                "slot-number";

            num.textContent=
                index+1;

            const icon=
                document.createElement(
                    "canvas"
                );

            icon.className=
                "block-icon";

            icon.width=32;
            icon.height=32;

            const ctx=
                icon.getContext(
                    "2d"
                );

            ctx.fillStyle=
                "#"+
                BLOCKS[type]
                    .color
                    .toString(16)
                    .padStart(
                        6,
                        "0"
                    );

            ctx.fillRect(
                0,
                0,
                32,
                32
            );

            slot.appendChild(num);
            slot.appendChild(icon);

            hotbar.appendChild(
                slot
            );
        }
    );
}

updateHotbar();


/* =========================================================
   MESSAGE
========================================================= */

const message=
    document.getElementById(
        "message"
    );

let messageTimer;

function showMessage(text){

    message.textContent=
        text;

    message.style.opacity="1";

    clearTimeout(
        messageTimer
    );

    messageTimer=
        setTimeout(
            ()=>{
                message.style.opacity="0";
            },
            1000
        );
}


/* =========================================================
   START
========================================================= */

document
.getElementById(
    "startButton"
)
.addEventListener(
    "click",
    ()=>{

        renderer.domElement
            .requestPointerLock();

        document.getElementById(
            "start"
        ).style.display=
            "none";
    }
);


/* =========================================================
   CHUNK STREAMING
========================================================= */

let lastChunkX=null;
let lastChunkZ=null;

function updateChunks(){

    const cx=
        worldToChunk(
            player.position.x
        );

    const cz=
        worldToChunk(
            player.position.z
        );

    if(
        cx===lastChunkX &&
        cz===lastChunkZ
    ){
        return;
    }

    lastChunkX=cx;
    lastChunkZ=cz;


    for(
        let dx=
            -RENDER_DISTANCE;
        dx<=
            RENDER_DISTANCE;
        dx++
    ){

        for(
            let dz=
                -RENDER_DISTANCE;
            dz<=
                RENDER_DISTANCE;
            dz++
        ){

            ensureChunk(
                cx+dx,
                cz+dz
            );
        }
    }


    /*
     * 멀어진 청크 제거
     */

    for(
        const [
            ck,
            chunk
        ] of chunks
    ){

        const [
            x,
            z
        ]=
            ck
            .split(",")
            .map(Number);

        if(
            Math.abs(x-cx)>
                RENDER_DISTANCE+1 ||
            Math.abs(z-cz)>
                RENDER_DISTANCE+1
        ){

            scene.remove(
                chunk.group
            );

            chunks.delete(
                ck
            );
        }
    }
}


/* =========================================================
   DAY NIGHT
========================================================= */

let worldTime=.25;

function updateDayNight(
    delta
){

    worldTime+=
        delta*.015;

    if(
        worldTime>=1
    ){
        worldTime-=1;
    }

    const angle=
        worldTime*
        Math.PI*2;

    const daylight=
        Math.max(
            .1,
            Math.sin(angle)*.5+.5
        );

    sun.position.set(
        Math.cos(angle)*100,
        Math.sin(angle)*100,
        40
    );

    sun.intensity=
        .25+
        daylight*.9;

    ambient.intensity=
        .25+
        daylight*.5;

    const sky=
        new THREE.Color();

    sky.lerpColors(
        new THREE.Color(
            0x10152b
        ),
        new THREE.Color(
            0x87ceeb
        ),
        daylight
    );

    scene.background=sky;
    scene.fog.color=sky;
}


/* =========================================================
   COORDINATES
========================================================= */

const coords=
    document.getElementById(
        "coords"
    );

function updateCoords(){

    coords.textContent=
        "XYZ: "+
        Math.floor(
            player.position.x
        )+
        " / "+
        Math.floor(
            player.position.y
        )+
        " / "+
        Math.floor(
            player.position.z
        );
}


/* =========================================================
   GAME LOOP
========================================================= */

let lastTime=
    performance.now();

function loop(now){

    requestAnimationFrame(
        loop
    );

    let dt=
        (now-lastTime)/1000;

    lastTime=now;

    dt=
        Math.min(
            dt,
            .05
        );


    /* camera */

    camera.rotation.order=
        "YXZ";

    camera.rotation.y=
        yaw;

    camera.rotation.x=
        pitch;


    /* movement */

    let forward=0;
    let strafe=0;

    if(keys.KeyS)
        forward++;

    if(keys.KeyW)
        forward--;

    if(keys.KeyA)
        strafe--;

    if(keys.KeyD)
        strafe++;


    const len=
        Math.hypot(
            forward,
            strafe
        );

    if(len>0){

        forward/=len;
        strafe/=len;
    }


    const mx=
        Math.sin(yaw)*forward+
        Math.cos(yaw)*strafe;

    const mz=
        Math.cos(yaw)*forward-
        Math.sin(yaw)*strafe;


    const speed=
        keys.ShiftLeft||
        keys.ShiftRight
            ?player.sprint
            :player.speed;


    move(
        mx*speed*dt,
        0,
        mz*speed*dt
    );


    /* gravity */

    player.velocity.y-=
        20*dt;

    move(
        0,
        player.velocity.y*dt,
        0
    );


    /* fall */

    if(
        player.position.y<-20
    ){

        player.position.set(
            0,
            15,
            8
        );

        player.velocity.set(
            0,0,0
        );
    }


    camera.position.set(
        player.position.x,
        player.position.y+1.6,
        player.position.z
    );


    updateChunks();

    if(mouseDown){

        const target=
            getTarget();

        if(target){

            const k=
                key(
                    target.x,
                    target.y,
                    target.z
                );

            if(
                !breaking||
                breakTarget!==k
            ){

                startBreak(
                    target
                );
            }
        }
    }

    updateBreak();

    updateDayNight(
        dt
    );

    updateCoords();

    renderer.render(
        scene,
        camera
    );
}


/* =========================================================
   RESIZE
========================================================= */

addEventListener(
    "resize",
    ()=>{

        camera.aspect=
            innerWidth/
            innerHeight;

        camera.updateProjectionMatrix();

        renderer.setSize(
            innerWidth,
            innerHeight
        );
    }
);


/* =========================================================
   START LOOP
========================================================= */

requestAnimationFrame(
    loop
);

</script>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문하기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

header {
    background: #222;
    color: white;
    text-align: center;
    padding: 22px;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    padding: 20px;
    margin-bottom: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 15px rgba(0,0,0,.08);
}

input {
    width: 100%;
    padding: 14px;
    font-size: 16px;
    border: 1px solid #ddd;
    border-radius: 10px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.product {
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}

.emoji {
    font-size: 45px;
}

.product h3 {
    margin-bottom: 5px;
}

.price {
    color: #666;
    margin-bottom: 15px;
}

.quantity {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

.quantity button {
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 10px;
    font-size: 22px;
    cursor: pointer;
}

.minus,
.plus {
    background: #eee;
}

.order-button {
    width: 100%;
    padding: 16px;
    border: 0;
    border-radius: 12px;
    background: #222;
    color: white;
    font-size: 18px;
    cursor: pointer;
}

.order-button:disabled {
    background: #aaa;
}

.total {
    text-align: right;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 15px;
}

.message {
    display: none;
    margin-top: 15px;
    padding: 14px;
    border-radius: 10px;
}

.success {
    background: #e5ffe8;
}

.error {
    background: #ffe5e5;
}
</style>
</head>

<body>

<header>
    <h1>🛒 주문하기</h1>
    <p>상품을 선택해주세요</p>
</header>

<div class="container">

    <div class="card">
        <h2>👤 주문자</h2>
        <input id="name" placeholder="이름을 입력하세요">
    </div>

    <div class="card">
        <h2>🍴 상품</h2>
        <div id="products" class="products">
            불러오는 중...
        </div>
    </div>

    <div class="card">

        <h2>💰 주문 금액</h2>

        <div id="total" class="total">
            0원
        </div>

        <button
            id="orderButton"
            class="order-button"
            onclick="submitOrder()">

            주문하기

        </button>

        <div id="message" class="message"></div>

    </div>

</div>


<script type="module">

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/* =========================
   Firebase
   ========================= */

const firebaseConfig = {

    apiKey:
        "AIzaSyDsmpnhM1PhQYwNZYXOXjKBrZyTUcNd1GI",

    authDomain:
        "gun-game-multi.firebaseapp.com",

    projectId:
        "gun-game-multi",

    storageBucket:
        "gun-game-multi.firebasestorage.app",

    messagingSenderId:
        "654895354599",

    appId:
        "1:654895354599:web:0a1d5d505619e49d380842",

    measurementId:
        "G-051STSK698"
};


const app = initializeApp(firebaseConfig);

const db = getFirestore(app);


/* =========================
   데이터
   ========================= */

let products = [];
let cart = {};


/* =========================
   상품 불러오기
   ========================= */

async function loadProducts() {

    try {

        const response =
            await fetch("./products.json");

        if (!response.ok) {
            throw new Error(
                "products.json을 불러올 수 없습니다."
            );
        }

        products = await response.json();

        products.forEach(product => {
            cart[product.id] = 0;
        });

        renderProducts();

    } catch (error) {

        console.error(error);

        document.getElementById("products").innerHTML =
            "❌ 상품을 불러오지 못했습니다.";

    }
}


/* =========================
   상품 화면
   ========================= */

function renderProducts() {

    const container =
        document.getElementById("products");

    container.innerHTML = "";

    products.forEach(product => {

        const div =
            document.createElement("div");

        div.className = "product";

        div.innerHTML = `

            <div class="emoji">
                ${product.emoji}
            </div>

            <h3>
                ${escapeHTML(product.name)}
            </h3>

            <div class="price">
                ${Number(product.price).toLocaleString()}원
            </div>

            <div class="quantity">

                <button
                    class="minus"
                    onclick="changeQuantity('${product.id}', -1)">
                    −
                </button>

                <strong id="qty-${product.id}">
                    0
                </strong>

                <button
                    class="plus"
                    onclick="changeQuantity('${product.id}', 1)">
                    +
                </button>

            </div>
        `;

        container.appendChild(div);
    });

}


/* =========================
   수량
   ========================= */

window.changeQuantity =
function(id, amount) {

    cart[id] += amount;

    if (cart[id] < 0) {
        cart[id] = 0;
    }

    document.getElementById(
        `qty-${id}`
    ).textContent = cart[id];

    updateTotal();
};


/* =========================
   총액
   ========================= */

function updateTotal() {

    let total = 0;

    products.forEach(product => {

        total +=
            Number(product.price) *
            cart[product.id];

    });

    document.getElementById("total")
        .textContent =
        total.toLocaleString() + "원";
}


/* =========================
   주문
   ========================= */

window.submitOrder =
async function() {

    const name =
        document
            .getElementById("name")
            .value
            .trim();


    if (!name) {

        showMessage(
            "이름을 입력해주세요.",
            true
        );

        return;
    }


    const items = [];


    products.forEach(product => {

        const quantity =
            cart[product.id];

        if (quantity > 0) {

            items.push({

                id: product.id,

                name: product.name,

                price:
                    Number(product.price),

                quantity: quantity

            });

        }

    });


    if (items.length === 0) {

        showMessage(
            "상품을 하나 이상 선택해주세요.",
            true
        );

        return;
    }


    const total =
        items.reduce(
            (sum, item) =>
                sum +
                item.price *
                item.quantity,
            0
        );


    const button =
        document.getElementById(
            "orderButton"
        );

    button.disabled = true;

    button.textContent =
        "주문 저장 중...";


    try {

        await addDoc(
            collection(db, "orders"),
            {

                name: name,

                items: items,

                total: total,

                status: "접수",

                createdAt:
                    serverTimestamp()

            }
        );


        showMessage(
            `✅ 주문이 접수되었습니다! 총 ${total.toLocaleString()}원`,
            false
        );


        document.getElementById(
            "name"
        ).value = "";


        products.forEach(product => {

            cart[product.id] = 0;

            document.getElementById(
                `qty-${product.id}`
            ).textContent = "0";

        });


        updateTotal();


    } catch (error) {

        console.error(error);

        showMessage(
            "❌ 주문 저장 실패\n" +
            error.message,
            true
        );

    }


    button.disabled = false;

    button.textContent =
        "주문하기";

};


/* =========================
   메시지
   ========================= */

function showMessage(text, error) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.className =
        "message " +
        (error ? "error" : "success");

    message.style.display = "block";

}


/* =========================
   HTML escape
   ========================= */

function escapeHTML(value) {

    return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/* 시작 */

loadProducts();

</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>주문하기</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f6fa;
    color: #222;
}

header {
    background: #222;
    color: white;
    padding: 20px;
    text-align: center;
}

.container {
    max-width: 900px;
    margin: auto;
    padding: 20px;
}

.card {
    background: white;
    border-radius: 15px;
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 3px 12px rgba(0,0,0,.08);
}

input {
    width: 100%;
    padding: 13px;
    border: 1px solid #ddd;
    border-radius: 10px;
    font-size: 16px;
}

.products {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 15px;
}

.product {
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 18px;
    text-align: center;
}

.product .emoji {
    font-size: 45px;
}

.product h3 {
    margin: 10px 0 5px;
}

.price {
    color: #666;
    margin-bottom: 12px;
}

.quantity {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 15px;
}

button {
    border: 0;
    border-radius: 10px;
    padding: 10px 15px;
    cursor: pointer;
    font-size: 15px;
}

.minus,
.plus {
    background: #eee;
}

.order-button {
    width: 100%;
    background: #222;
    color: white;
    padding: 15px;
    font-size: 18px;
}

.total {
    font-size: 24px;
    font-weight: bold;
    text-align: right;
}

.message {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    display: none;
}
</style>
</head>

<body>

<header>
    <h1>🛒 주문하기</h1>
    <p>상품을 선택하고 주문해주세요.</p>
</header>

<div class="container">

    <div class="card">
        <h2>👤 주문자</h2>
        <input id="name" placeholder="이름을 입력하세요">
    </div>

    <div class="card">
        <h2>🍴 상품</h2>
        <div id="products" class="products">
            상품을 불러오는 중...
        </div>
    </div>

    <div class="card">
        <h2>💰 주문 금액</h2>
        <div id="total" class="total">0원</div>
        <br>
        <button class="order-button" onclick="submitOrder()">
            주문하기
        </button>

        <div id="message" class="message"></div>
    </div>

</div>

<script type="module">

/* ============================
   Firebase 설정
   ============================ */

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
    getFirestore,
    collection,
    addDoc,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


/*
   👇 Firebase Console에서 받은 설정으로 교체하세요.
*/

const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_PROJECT.firebaseapp.com",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_PROJECT.firebasestorage.app",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
};


const app = initializeApp(firebaseConfig);
const db = getFirestore(app);


/* ============================
   상품
   ============================ */

let products = [];
let cart = {};


/* 상품 JSON 읽기 */

async function loadProducts() {

    try {

        const response = await fetch("products.json");

        if (!response.ok) {
            throw new Error("products.json을 찾을 수 없습니다.");
        }

        products = await response.json();

        products.forEach(product => {
            cart[product.id] = 0;
        });

        renderProducts();

    } catch (error) {

        document.getElementById("products").innerHTML =
            `<p>상품을 불러오지 못했습니다.<br>${error.message}</p>`;

    }
}


/* 상품 표시 */

function renderProducts() {

    const container = document.getElementById("products");

    container.innerHTML = "";

    products.forEach(product => {

        const div = document.createElement("div");

        div.className = "product";

        div.innerHTML = `
            <div class="emoji">${product.emoji}</div>

            <h3>${product.name}</h3>

            <div class="price">
                ${product.price.toLocaleString()}원
            </div>

            <div class="quantity">

                <button class="minus"
                    onclick="changeQuantity('${product.id}', -1)">
                    −
                </button>

                <strong id="qty-${product.id}">
                    0
                </strong>

                <button class="plus"
                    onclick="changeQuantity('${product.id}', 1)">
                    +
                </button>

            </div>
        `;

        container.appendChild(div);

    });

}


/* 수량 변경 */

window.changeQuantity = function(id, amount) {

    cart[id] += amount;

    if (cart[id] < 0) {
        cart[id] = 0;
    }

    document.getElementById(`qty-${id}`).textContent = cart[id];

    updateTotal();
};


/* 총액 */

function updateTotal() {

    let total = 0;

    products.forEach(product => {

        total += product.price * cart[product.id];

    });

    document.getElementById("total").textContent =
        total.toLocaleString() + "원";

}


/* 주문 */

window.submitOrder = async function() {

    const name =
        document.getElementById("name").value.trim();

    if (!name) {
        showMessage("이름을 입력해주세요.", true);
        return;
    }


    const items = [];

    products.forEach(product => {

        const quantity = cart[product.id];

        if (quantity > 0) {

            items.push({
                id: product.id,
                name: product.name,
                price: product.price,
                quantity: quantity
            });

        }

    });


    if (items.length === 0) {

        showMessage("상품을 하나 이상 선택해주세요.", true);
        return;

    }


    const total = items.reduce(
        (sum, item) =>
            sum + item.price * item.quantity,
        0
    );


    try {

        await addDoc(collection(db, "orders"), {

            name: name,

            items: items,

            total: total,

            status: "접수",

            createdAt: serverTimestamp()

        });


        showMessage("✅ 주문이 접수되었습니다!", false);


        /* 초기화 */

        document.getElementById("name").value = "";

        products.forEach(product => {

            cart[product.id] = 0;

            document.getElementById(
                `qty-${product.id}`
            ).textContent = "0";

        });

        updateTotal();


    } catch (error) {

        console.error(error);

        showMessage(
            "주문 저장에 실패했습니다. Firebase 설정을 확인해주세요.",
            true
        );

    }

};


/* 메시지 */

function showMessage(text, error) {

    const message =
        document.getElementById("message");

    message.textContent = text;

    message.style.display = "block";

    message.style.background =
        error ? "#ffe5e5" : "#e5ffe8";

}


/* 시작 */

loadProducts();

</script>

</body>
</html>
